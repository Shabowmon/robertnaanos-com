<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robert Naanos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main { max-width: 560px; width: 100%; }
  h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .tag { color: #8b949e; font-size: 1.1rem; margin-bottom: 2.5rem; }
  .projects { display: flex; flex-direction: column; gap: 1rem; }
  .projects a {
    display: block;
    padding: 1.25rem 1.5rem;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    color: #e6edf3;
    text-decoration: none;
    transition: border-color 0.2s;
  }
  .projects a[href]:hover { border-color: #58a6ff; }
  .projects a .name {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .projects a .name::before {
    content: "";
    flex: none;
    width: 0.7em;
    height: 0.7em;
    border: 2px solid #8b949e;
    border-radius: 50%;
    transition: border-color 0.2s;
  }
  .projects a[href]:hover .name::before { border-color: #58a6ff; }
  .projects a .desc { color: #8b949e; font-size: 0.95rem; margin-top: 0.25rem; }
  footer {
    margin-top: 3rem;
    color: #6e7681;
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>
  <main>
    <h1>Robert Naanos</h1>
    <p class="tag">Builder. Lifter. Night owl.</p>
    <div class="projects">
      <a href="https://lifts.robertnaanos.com">
        <div class="name">lifts</div>
        <div class="desc">Workout logger</div>
      </a>
      <a href="https://recipes.robertnaanos.com">
        <div class="name">recipes</div>
        <div class="desc">Personal recipe box</div>
      </a>
      <a href="https://ideas.robertnaanos.com">
        <div class="name">ideas</div>
        <div class="desc">What I'm building, and what's next</div>
      </a>
      <a href="https://signals.robertnaanos.com">
        <div class="name">signals</div>
        <div class="desc">Money verdicts from the podcasts</div>
      </a>
    </div>
    <footer>Deploys on every git push · Cloudflare Pages</footer>
  </main>
</body>
</html>
